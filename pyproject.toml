[project]
name = "ha-hungarian-power-outages"
version = "0.1.0"
requires-python = ">=3.14"
description = "Hungarian electricity outage reports for Home Assistant"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv-ha9"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
